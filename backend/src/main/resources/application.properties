spring.application.name=backend

jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-de-32-bytes-minimo}

spring.datasource.url=jdbc:postgresql://localhost:5432/football_market
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



springdoc.show-actuator=true
management.endpoints.web.exposure.include=health

football.api.key=${FOOTBALL_DATA_API_KEY:a95afbb2b63240fa91eb8fa300eb9da3}
football.api.url=https://api.football-data.org/v4

# Cron para ejecucion cada domingo a las 00:00 hs (medianoche del domingo) Zona Argentina
scheduler.football-data.cron=0 0 0 * * SUN

